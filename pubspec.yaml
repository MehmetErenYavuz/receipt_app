name: receipt_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  image: 4.3.0
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  
  # Dışa aktarım ve Excel işlemleri için eklenenler
  excel: ^4.0.6
  share_plus: ^13.1.0
  crypto: ^3.0.7
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # On-device NER modeli (Türkçe fiş/fatura) — input_contract.md paritesi
  assets:
    - assets/models/model_int8.onnx
    - assets/models/vocab.txt